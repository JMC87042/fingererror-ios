name: FingerError
options:
  bundleIdPrefix: com.jmc
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  FingerError:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "FingerError"
        CFBundleName: "FingerError"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmc.fingererror
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FingerErrorKeyboard
    scheme: {}
  FingerErrorKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["*.entitlements"]
      - Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: "FingerError"
        CFBundleName: "FingerErrorKeyboard"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmc.fingererror.keyboard
        APPLICATION_EXTENSION_API_ONLY: "YES"
